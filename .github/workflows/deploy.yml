name: データ更新 & GitHub Pages 公開

on:
  push:
    branches: [claude/j2-soccer-app-1tp2v7]
  schedule:
    # 日本時間 6:15〜24:15 の2時間おき (1回の実行で Wikipedia へのリクエストは1回だけ)
    - cron: '15 21,23,1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Wikipedia からデータ取得
        env:
          # 公開中のデータから試合日を引き継ぐ (取得に失敗したときはそのまま使う)
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/season.json
        run: npm run fetch-data
      - name: ビルド
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
